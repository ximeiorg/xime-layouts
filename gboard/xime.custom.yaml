keyboard:
  # ── 键面圆角 / 间距（按实机截图实测的比例换算到 Xime 的 44dp 键高）──
  # 截图：654px 宽，键面 51×72，横缝 10，竖缝 19，圆角约 6
  #   · 圆角 / 键高 = 6 / 72 ≈ 0.083 → 44dp 键高约 3.7dp，取 4
  #   · 横缝 / 键宽 = 10 / 51 ≈ 0.196 → 键宽约 34dp 时缝约 6.7dp（spacing_x 按“左右各留”算缝宽的一半）
  #   · 竖缝 / 键高 = 19 / 72 ≈ 0.264 → 44dp 键高时缝约 11.6dp
  # Gboard 的键是「窄高 + 大缝 + 小圆角」，这三项一起才像，单改圆角会更不像
  key:
    corner_radius: 6
    spacing_x: 3      # 实际横缝 ≈6.5dp
    spacing_y: 5.75      # 实际竖缝 ≈11.5dp，Gboard 行距明显比列距大
    # 只有九键的键明显更大（3 列），圆角同比放大
    t9: { corner_radius: 10, spacing_x: 4, spacing_y: 4 }
    # ⚠ 面板这两行不能省，哪怕数值和上面完全一样：
    #   基座 xime.yaml 的 key 段给 number / symbol 单独调过缝（number 2/2、symbol 2/4），
    #   而 KeysConfigHelper.spacingFor() 是「键盘覆盖优先于全局值」——
    #   只写全局 spacing_x/spacing_y 时，26 键用 3/5.75，?123 面板却退回 2/4，
    #   于是圆角一致、缝不一致（这正是「面板比字母键挤」的原因）。
    #   面板段名和键名不同：常用符号面板查的是 symbol，数字面板查的是 number
    #   （见 KeyboardLayoutScreen.kt 的 spacingFor("symbol") / spacingFor("number")）。
    number: { spacing_x: 3, spacing_y: 5.75 }
    symbol: { spacing_x: 3, spacing_y: 5.75 }

  # Gboard 的键是纯色块：没有投影，也没有按键边框（Key borders 在 Xime 里画不出来）。
  # 所以这里关掉阴影，靠「键色与底色的亮度差 + 大缝」区分按键，和 Gboard 一致。
  shadow:
    enabled: false
    shape_radius: 4

  # ═════════════════════════════════════════════════════════════════════════
  # 26 键全键盘（中文）——Gboard 排布
  # 字母键只写 tap + long_press，不写 swipe_up —— 让上滑/下滑完全继承基座：
  #   q-p 上滑 1-0、a-l 上滑 ～／：；“”－、z-m 上滑剩余标点，下滑是五笔字根提示。
  # 键面上的数字/符号角标由此而来，是刻意保留的 Xime 手感（用户明确要求「上滑不能掉」）。
  # 长按只出变音符号，大小写交给 Shift
  # ═════════════════════════════════════════════════════════════════════════
  qwerty:
    button_layout: standard
    layout:
      columns: 10
      rows:
        - [q, w, e, r, t, y, u, i, o, p]
        - [a, s, d, f, g, h, j, k, l]
        - [shift, z, x, c, v, b, n, m, delete]
        - [mode_change, comma, earth, space, period, enter]
    keys:
      # ── 第一行：长按变音符号（与 Gboard 英文键盘一致，不含大写）──
      q: { tap: "q" }
      w: { tap: "w", long_press: { display: "bubble", values: [{ action: commit, value: "w" }, { action: commit, value: "ŵ" }] } }
      e: { tap: "e", long_press: { display: "bubble", values: [{ action: commit, value: "e" }, { action: commit, value: "è" }, { action: commit, value: "é" }, { action: commit, value: "ê" }, { action: commit, value: "ë" }, { action: commit, value: "ē" }, { action: commit, value: "ė" }, { action: commit, value: "ę" }] } }
      r: { tap: "r", long_press: { display: "bubble", values: [{ action: commit, value: "r" }, { action: commit, value: "ŕ" }, { action: commit, value: "ř" }] } }
      t: { tap: "t", long_press: { display: "bubble", values: [{ action: commit, value: "t" }, { action: commit, value: "ť" }, { action: commit, value: "þ" }] } }
      y: { tap: "y", long_press: { display: "bubble", values: [{ action: commit, value: "y" }, { action: commit, value: "ý" }, { action: commit, value: "ÿ" }] } }
      u: { tap: "u", long_press: { display: "bubble", values: [{ action: commit, value: "u" }, { action: commit, value: "û" }, { action: commit, value: "ü" }, { action: commit, value: "ù" }, { action: commit, value: "ú" }, { action: commit, value: "ū" }] } }
      i: { tap: "i", long_press: { display: "bubble", values: [{ action: commit, value: "i" }, { action: commit, value: "î" }, { action: commit, value: "ï" }, { action: commit, value: "í" }, { action: commit, value: "ì" }, { action: commit, value: "ī" }, { action: commit, value: "į" }] } }
      o: { tap: "o", long_press: { display: "bubble", values: [{ action: commit, value: "o" }, { action: commit, value: "ô" }, { action: commit, value: "ö" }, { action: commit, value: "ò" }, { action: commit, value: "ó" }, { action: commit, value: "œ" }, { action: commit, value: "ø" }, { action: commit, value: "ō" }, { action: commit, value: "õ" }] } }
      p: { tap: "p" }

      # ── 第二行 ──
      a: { tap: "a", long_press: { display: "bubble", values: [{ action: commit, value: "a" }, { action: commit, value: "à" }, { action: commit, value: "á" }, { action: commit, value: "â" }, { action: commit, value: "ä" }, { action: commit, value: "æ" }, { action: commit, value: "ã" }, { action: commit, value: "å" }, { action: commit, value: "ā" }] } }
      s: { tap: "s", long_press: { display: "bubble", values: [{ action: commit, value: "s" }, { action: commit, value: "ß" }, { action: commit, value: "ś" }, { action: commit, value: "š" }] } }
      d: { tap: "d", long_press: { display: "bubble", values: [{ action: commit, value: "d" }, { action: commit, value: "ď" }, { action: commit, value: "đ" }] } }
      f: { tap: "f" }
      g: { tap: "g", long_press: { display: "bubble", values: [{ action: commit, value: "g" }, { action: commit, value: "ğ" }] } }
      h: { tap: "h", long_press: { display: "bubble", values: [{ action: commit, value: "h" }, { action: commit, value: "ĥ" }] } }
      j: { tap: "j", long_press: { display: "bubble", values: [{ action: commit, value: "j" }, { action: commit, value: "ĵ" }] } }
      k: { tap: "k", long_press: { display: "bubble", values: [{ action: commit, value: "k" }, { action: commit, value: "ķ" }] } }
      l: { tap: "l", long_press: { display: "bubble", values: [{ action: commit, value: "l" }, { action: commit, value: "ł" }, { action: commit, value: "ĺ" }, { action: commit, value: "ľ" }] } }

      # ── 第三行 ──
      z: { tap: "z", long_press: { display: "bubble", values: [{ action: commit, value: "z" }, { action: commit, value: "ź" }, { action: commit, value: "ž" }, { action: commit, value: "ż" }] } }
      x: { tap: "x" }
      c: { tap: "c", long_press: { display: "bubble", values: [{ action: commit, value: "c" }, { action: commit, value: "ç" }, { action: commit, value: "ć" }, { action: commit, value: "č" }] } }
      v: { tap: "v" }
      b: { tap: "b" }
      n: { tap: "n", long_press: { display: "bubble", values: [{ action: commit, value: "n" }, { action: commit, value: "ñ" }, { action: commit, value: "ń" }] } }
      m: { tap: "m" }

      # ── 功能键 ──
      # 底行按底行放大图（以字母键为 1，合计正好 10 列，与 Q 行格子对齐）：
      #   ?123 1.3（圆）· ，1.0 · 地球 1.0 · 空格 3.7 · 。1.0 · 换行 2.0（圆）
      # Gboard 的 ?123 与换行是圆形键，见各键上的 corner_radius: 40；
      # 换行再叠一层主色（background: accent，随主题），见文件头说明 4
      # Shift / 退格在 Gboard 里约等于 1.5 个字母键
      # 功能键的行为要一并写出：xime.custom.yaml 的 keys 是「同名键整体覆盖」，
      # 只写 width 会把基座里的 shift/退格/空格手势一起丢掉
      shift:
        width: 1.5
        tap: { action: command, value: shift_single }
        double_tap: { action: command, value: shift_caps }
      delete:
        width: 1.5
        tap: { action: delete }
        long_press: { values: [{ action: delete, label: "删除" }] }
        swipe_up: { action: clear_all, label: "上滑清空" }
        swipe_down: { action: undo_clear, label: "下滑撤回" }
        swipe_left: { action: command, value: clear_composition }
        swipe_right: { action: command, value: clear_composition }

      # ?123：单击固定进常用符号面板（Gboard 的 ？123 首页第一行就是 1-0）。
      # 必须写 mode_change_common_symbol，不能写那个做模式切换的 mode_change：后者的
      # 目标是「上次用过的面板」（SettingsPreferences.getModeChangeTargetIsNumber 会持久化），
      # 只要长按选过一次「数字」，之后每次点 ?123 都进数字面板，观感就是功能反了。
      # 长按两项的顺序要与 Xime 固定给的气泡图标对应：第一项恒为 t9（九宫格）图标、
      # 第二项恒为 t26（全键盘）图标，九宫格对应数字面板，所以「数字」放第一位。
      mode_change:
        width: 1.5
        corner_radius: 40   # 夹到键高一半 → 圆形（Gboard 的 ?123 就是圆键）
        tap: { label: "?123", action: command, value: mode_change_common_symbol, bubble: false }
        long_press:
          display: bubble
          values:
            - { label: "数字", action: command, value: mode_change_number }
            - { label: "常用符号", action: command, value: mode_change_common_symbol }

      # 逗号：键面“，”，上滑进表情面板（Gboard 的逗号键上就是表情入口，
      # 图标画在逗号上方；Xime 的手势提示只能是字符，这里用 emoji 字符近似那个笑脸）
      comma:
        width: 1.0
        tap: { label: "，", value: "," }
        swipe_up: { label: "😊", action: switch_route, value: emoji, display: key, bubble: false }
        long_press: { display: "bubble", values: [{ action: commit, value: "，" }, { action: commit, value: "、" }, { action: commit, value: "," }] }

      # 中/英：Xime 的地球图标（label 里的 @language 是图标标记），
      # 位置与 Gboard 多语言时地球键的位置一致：空格左侧
      earth:
        width: 1.0
        tap: { label: "@language", action: toggle_ascii, bubble: false }
        long_press:
          display: bubble
          values:
            - { label: "选择输入法", action: command, value: show_ime_picker }

      # 空格：Gboard 的空格很宽；点按空格、长按语音
      space:
        width: 3.7
        tap: { action: space }
        long_press: { label: "语音", action: voice, bubble: false }

      # 句号：键面“。”，长按可选 。，？！
      period:
        width: 1.0
        tap: { label: "。", value: "." }
        long_press:
          display: bubble
          values:
            - { action: commit, value: "。" }
            - { action: commit, value: "，" }
            - { action: commit, value: "？" }
            - { action: commit, value: "！" }

      # 换行：Gboard 的换行键是「主色 + 圆形」——这是 Gboard 最显眼的一处特色。
      # tap 用 action: enter。文案故意写成 3 个字符「换行↵」，不是为了好看，是为了字号：
      #   KeyboardLayout.kt:931 → EnterCell(..., keyEnv.ctrlFontSize)，主键盘 ctrlFontSize
      #   是 null → KeyButton.kt:950 兜底 =「text.length > 2 ? 14f : 18f」。
      #   而 ?123 面板（PanelKeyboardLayout.kt:157）把 ctrlFontSize 写死 14.sp，
      #   所以 2 字符的「换行」在主键盘是 18sp、到面板却成 14sp，落差 1.29 倍。
      #   写成 3 字符后两边都落 14sp，字号完全一致，?123 / 空格 / 回车三键也齐了
      #   （「?123」本来就是 4 字符走 14sp）。
      #   代价：显式 label 会盖掉 Xime 随场景自动给的文案（发送 / 搜索 / 完成）。
      #   想换回自动文案就得接受 18sp —— 配置层没有字号字段（style.font_size 是死字段）。
      # background: accent = 主题强调色记号，不是固定色：切到蓝主题就是蓝键、红主题就是红键，
      # 亮暗切换也自动换（暗色取 accentDark，即 primary_color 的提亮版，正好对上
      # 实机截图那颗亮薄荷）。字色由渲染层按背景亮度自动取，这里不用管 key_text_color。
      enter:
        width: 2.0
        corner_radius: 40
        background: accent
        tap: { action: enter, label: "换行", bubble: false }

  # ═════════════════════════════════════════════════════════════════════════
  # 26 键全键盘（英文）——排布与中文一致，标点用半角
  # ═════════════════════════════════════════════════════════════════════════
  qwerty_en:
    button_layout: standard
    layout:
      columns: 10
      rows:
        - [q, w, e, r, t, y, u, i, o, p]
        - [a, s, d, f, g, h, j, k, l]
        - [shift, z, x, c, v, b, n, m, delete]
        - [mode_change, comma, earth, space, period, enter]
    keys:
      q: { tap: "q" }
      w: { tap: "w", long_press: { display: "bubble", values: [{ action: commit, value: "w" }, { action: commit, value: "ŵ" }] } }
      e: { tap: "e", long_press: { display: "bubble", values: [{ action: commit, value: "e" }, { action: commit, value: "è" }, { action: commit, value: "é" }, { action: commit, value: "ê" }, { action: commit, value: "ë" }, { action: commit, value: "ē" }, { action: commit, value: "ė" }, { action: commit, value: "ę" }] } }
      r: { tap: "r", long_press: { display: "bubble", values: [{ action: commit, value: "r" }, { action: commit, value: "ŕ" }, { action: commit, value: "ř" }] } }
      t: { tap: "t", long_press: { display: "bubble", values: [{ action: commit, value: "t" }, { action: commit, value: "ť" }, { action: commit, value: "þ" }] } }
      y: { tap: "y", long_press: { display: "bubble", values: [{ action: commit, value: "y" }, { action: commit, value: "ý" }, { action: commit, value: "ÿ" }] } }
      u: { tap: "u", long_press: { display: "bubble", values: [{ action: commit, value: "u" }, { action: commit, value: "û" }, { action: commit, value: "ü" }, { action: commit, value: "ù" }, { action: commit, value: "ú" }, { action: commit, value: "ū" }] } }
      i: { tap: "i", long_press: { display: "bubble", values: [{ action: commit, value: "i" }, { action: commit, value: "î" }, { action: commit, value: "ï" }, { action: commit, value: "í" }, { action: commit, value: "ì" }, { action: commit, value: "ī" }, { action: commit, value: "į" }] } }
      o: { tap: "o", long_press: { display: "bubble", values: [{ action: commit, value: "o" }, { action: commit, value: "ô" }, { action: commit, value: "ö" }, { action: commit, value: "ò" }, { action: commit, value: "ó" }, { action: commit, value: "œ" }, { action: commit, value: "ø" }, { action: commit, value: "ō" }, { action: commit, value: "õ" }] } }
      p: { tap: "p" }
      a: { tap: "a", long_press: { display: "bubble", values: [{ action: commit, value: "a" }, { action: commit, value: "à" }, { action: commit, value: "á" }, { action: commit, value: "â" }, { action: commit, value: "ä" }, { action: commit, value: "æ" }, { action: commit, value: "ã" }, { action: commit, value: "å" }, { action: commit, value: "ā" }] } }
      s: { tap: "s", long_press: { display: "bubble", values: [{ action: commit, value: "s" }, { action: commit, value: "ß" }, { action: commit, value: "ś" }, { action: commit, value: "š" }] } }
      d: { tap: "d", long_press: { display: "bubble", values: [{ action: commit, value: "d" }, { action: commit, value: "ď" }, { action: commit, value: "đ" }] } }
      f: { tap: "f" }
      g: { tap: "g", long_press: { display: "bubble", values: [{ action: commit, value: "g" }, { action: commit, value: "ğ" }] } }
      h: { tap: "h", long_press: { display: "bubble", values: [{ action: commit, value: "h" }, { action: commit, value: "ĥ" }] } }
      j: { tap: "j", long_press: { display: "bubble", values: [{ action: commit, value: "j" }, { action: commit, value: "ĵ" }] } }
      k: { tap: "k", long_press: { display: "bubble", values: [{ action: commit, value: "k" }, { action: commit, value: "ķ" }] } }
      l: { tap: "l", long_press: { display: "bubble", values: [{ action: commit, value: "l" }, { action: commit, value: "ł" }, { action: commit, value: "ĺ" }, { action: commit, value: "ľ" }] } }
      z: { tap: "z", long_press: { display: "bubble", values: [{ action: commit, value: "z" }, { action: commit, value: "ź" }, { action: commit, value: "ž" }, { action: commit, value: "ż" }] } }
      x: { tap: "x" }
      c: { tap: "c", long_press: { display: "bubble", values: [{ action: commit, value: "c" }, { action: commit, value: "ç" }, { action: commit, value: "ć" }, { action: commit, value: "č" }] } }
      v: { tap: "v" }
      b: { tap: "b" }
      n: { tap: "n", long_press: { display: "bubble", values: [{ action: commit, value: "n" }, { action: commit, value: "ñ" }, { action: commit, value: "ń" }] } }
      m: { tap: "m" }

      shift:
        width: 1.5
        tap: { action: command, value: shift_single }
        double_tap: { action: command, value: shift_caps }
      delete:
        width: 1.5
        tap: { action: delete }
        long_press: { values: [{ action: delete, label: "删除" }] }
        swipe_up: { action: clear_all, label: "上滑清空" }
        swipe_down: { action: undo_clear, label: "下滑撤回" }
        swipe_left: { action: command, value: clear_composition }
        swipe_right: { action: command, value: clear_composition }
      # ?123：单击固定进常用符号面板（Gboard 的 ？123 首页第一行就是 1-0）。
      # 必须写 mode_change_common_symbol，不能写那个做模式切换的 mode_change：后者的
      # 目标是「上次用过的面板」（SettingsPreferences.getModeChangeTargetIsNumber 会持久化），
      # 只要长按选过一次「数字」，之后每次点 ?123 都进数字面板，观感就是功能反了。
      # 长按两项的顺序要与 Xime 固定给的气泡图标对应：第一项恒为 t9（九宫格）图标、
      # 第二项恒为 t26（全键盘）图标，九宫格对应数字面板，所以「数字」放第一位。
      mode_change:
        width: 1.3
        corner_radius: 40   # 夹到键高一半 → 圆形（Gboard 的 ?123 就是圆键）
        tap: { label: "?123", action: command, value: mode_change_common_symbol, bubble: false }
        long_press:
          display: bubble
          values:
            - { label: "数字", action: command, value: mode_change_number }
            - { label: "常用符号", action: command, value: mode_change_common_symbol }
      # 逗号：上滑进表情面板（Gboard 英文键盘也是这个位置）。
      # 英文态的手势提示取的是 value（"emoji"）而不是 label，直接把提示画在键面会印出
      # "emoji" 五个字母，所以这里只绑动作、不显示键面提示（display: bubble + bubble: false）。
      comma:
        width: 1.0
        tap: { label: ",", value: "," }
        swipe_up: { label: "😊", action: switch_route, value: emoji, display: bubble, bubble: false }
        long_press: { display: "bubble", values: [{ action: commit, value: "," }, { action: commit, value: "." }] }
      earth:
        width: 1.0
        tap: { label: "@language", action: toggle_ascii, bubble: false }
        long_press:
          display: bubble
          values:
            - { label: "选择输入法", action: command, value: show_ime_picker }
      space:
        width: 3.7
        tap: { action: space }
        long_press: { label: "语音", action: voice, bubble: false }
      period:
        width: 1.0
        tap: { label: ".", value: "." }
        long_press:
          display: bubble
          values:
            - { action: commit, value: "." }
            - { action: commit, value: "," }
            - { action: commit, value: "?" }
            - { action: commit, value: "!" }
      # 换行：与中文键盘一致（主色 + 圆形），颜色/字号理由见上面 qwerty 段。
      enter:
        width: 2.0
        corner_radius: 40
        background: accent
        tap: { action: enter, label: "换行↵", bubble: false }

  # ═════════════════════════════════════════════════════════════════════════
  # 九宫格拼音（T9）——Gboard 排布
  #   左栏：候选面板（空闲时显示 ，。？！）+ 符号
  #   主区：分词 / ABC / DEF，GHI / JKL / MNO，PQRS / TUV / WXYZ，123 空格 中英
  #   右栏：退格 / 重输 / 换行
  #
  # 何时显示九键：由基座的 keyboard.t9.schemas 决定（默认 t9_pinyin / t9 /
  # wanxiang_t9 / rime_frost_t9）。想让自己的方案也用九键，在本段追加
  # （列表要整段写出，不能只写新增项）：
  #   schemas: [t9_pinyin, t9, wanxiang_t9, rime_frost_t9, 你的方案id]
  # ═════════════════════════════════════════════════════════════════════════
  t9:
    type: t9
    layout:
      left: [candidates, symbol]
      rows:
        - ["1", "2", "3"]
        - ["4", "5", "6"]
        - ["7", "8", "9"]
        - [number, space, earth]
      right: [delete, clear, enter]

    # 左栏空闲时显示的快捷符号（Gboard 九键为 ，。？！）
    side_symbols: ["，", "。", "？", "！"]

    keys:
      # 底行比例：Gboard 九键的 123 与地球键都比字母键窄，空格吃满剩余宽度
      number: { width: 0.8 }
      # 空格：点按空格、长按语音；上滑直接上屏 0（沿用基座九键的手势）
      space:
        width: 1.7
        tap: { action: space }
        long_press: { label: "语音", action: voice, bubble: false }
        swipe_up: { action: commit, value: "0", display: "key", bubble: false }
      # 中英切换用九键内置的地球键（只改宽度，行为与图标都沿用内置）
      earth: { width: 0.8 }
      # 右栏四行三键，等高铺满（内置 enter 权重是 2，这里拉平）
      enter: { width: 1.0 }

  # ═════════════════════════════════════════════════════════════════════════
  # ？123 面板（Gboard 的两页符号合并成一页）
  # 1-0 / @ # $ _ & - + ( ) / / * " ' : ; ! ? = % ~ / ABC ， 空格 。 换行
  # ═════════════════════════════════════════════════════════════════════════
  common_symbols:
    type: full
    layout:
      rows:
        - ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"]
        - ["@", "#", "$", "_", "&", "-", "+", "(", ")", "/"]
        - ["*", "\"", "'", ":", ";", "!", "?", "=", "%", "~"]
        # 底行顺序照 Gboard 的 ？123 面板：ABC ， 空格 。 换行
        - [back, ",", space_key, ".", enter]
    keys:
      # 底行权重与 26 键完全同一套，两个面板的标点、空格、回车宽度因此一致：
      #   ABC 1.3 · ，1.0 · 空格 4.7 · 。1.0 · 回车 2.0（合计 10 列）
      # 26 键多的那个地球键（1.0）在这里并入空格，所以空格是 3.7 + 1.0。
      back: { width: 1.3, tap: { label: "ABC" } }
      ",": { width: 1.0 }
      space_key: { width: 4.7 }
      ".": { width: 1.0 }
      # 回车与 26 键同款：圆形 + 主题强调色 + 同一句文案「换行↵」。
      # 面板这里字号本来就是 14sp（PanelKeyboardLayout.kt:157 写死的 ctrlFontSize），
      # 文案与 26 键对齐，切面板时键面不会既有大小差又有字数差。
      enter:
        width: 2.0
        corner_radius: 40
        background: accent
        tap: { action: send_rime, value: enter, label: "换行" }

  # ── 数字面板：只统一外观，不改布局 ──
  # 三列模式的右列固定四键（delete / 空格 / 表情 / 回车），每键等分列高、
  # 宽度由列宽决定，所以这里不可能像 26 键那样调权重，只能把「圆形 + 主题强调色」补齐。
  # 只写外观字段时 mergeKeyBinding 走 style-only 分支，基座的 tap（send_rime enter）保留。
  number:
    keys:
      enter:
        corner_radius: 40
        background: accent

# ═══════════════════════════════════════════════════════════════════════════
# Gboard 风格布局（Xime / 安卓）
#
# 参考：Gboard 实机截图两张 ——
#   ① 字母页（654×529，键面 51×72、横缝 10、竖缝 19、圆角 ≈6）
#   ② 底行放大图：?123 与换行是「圆形键」、逗号键面带 😊、空格 = 5.9 个字母键宽
# 覆盖：26 键全键盘、九宫格拼音、？123 符号面板、7 套配色
# 基座：Xime/app/src/main/assets/xime.yaml（未写的键自动回退基座值）
#
# 安装：把本文件放到 Xime 用户目录 rime/xime.custom.yaml
#       （Android/data/<包名>/files/rime/），然后在键盘设置里重新部署/重启输入法。
#
# 覆盖范围：
#   · 键面几何：圆角 6dp、横缝 6.5dp、竖缝 11.5dp、无阴影
#              （三项比例照截图换算；Gboard 是「窄高 + 大缝 + 小圆角」，只改圆角会更不像）
#   · 按键级外观（键盘级的补充）：
#             ?123 与换行写成圆形键 —— `corner_radius: 40`，Compose 的 RoundedCornerShape
#             会把半径夹到「键宽/键高的一半」，所以 40 等于「能多圆就多圆」，
#             不依赖具体键高；1.2 键宽 + 圆角 → 与 Gboard 的两个圆键同形。
#             换行再叠主色（background: accent，随主题），见说明 4。
#   · 主题色：全部来自 Gboard 18.5.9 自带的配色表，不是目测 ——
#             APK 内 assets/theme/style_sheet_color_*.binarypb（protobuf 二进制），
#             逐字段解析出 keyboard_background_primary / bordered_key / bordered_key_dark /
#             generic_accent / label 五组颜色，再用 adb 截真实键盘逐点核对。
#   · Gboard 皮肤（共 7 套，只做 Gboard「主题 → 颜色」这一组）：
#             gboard          浅色 / 深色（同一套主题，跟随系统）
#                             浅 #F0F4F9 底 / 白键 / #E4E7E9 功能键 / 深灰字，薄荷绿强调
#                             暗 #263238 底 / #3B464C 键 / #2E3A40 功能键 / 白字
#             gboard_google   Google 浅色 / 深色（同上键面，强调色改为 Google 蓝）
#                             浅强调 #1A73E8；暗 #363B40 底 / #565A5E 键，强调 #5E97F6
#             gboard_blue     蓝     #1565C0 底 / #3F80CB 键 / #2771C4 功能键 / 白字
#             gboard_red      红     #C62828 底 / #D04E4E 键
#             gboard_green    绿     #43A047 底 / #64B168 键
#             gboard_teal     蓝绿   #00695C 底 / #2E8479 键
#             gboard_cyan     浅蓝绿 #80DEEA 底 / #ACE9F1 键 / 深灰字
#             Gboard 把「浅色 / 深色」摆成两个格子，是因为它的主题固定、要手动选；
#             Xime 的同一套 scheme 自带 _dark 字段会跟随系统，所以这里合成一个主题。
#             彩色 5 套是固定色（亮暗同款），与 Gboard 自身行为一致。
#   · 26 键：字母键**保留 Xime 的上滑与下滑**（不为了像 Gboard 而砍功能）：
#              第一行 q-p 上滑 = 1-0，第二/三行上滑 = ～ ／ ： ； “ ” － 等半角标点，
#              下滑仍是基座的五笔字根提示（action: none，只提示不输入）。
#            Gboard 的字母键没有上滑，所以键面会因此多出角标（q 上的 1、a 上的 ～），
#            这是刻意保留的功能，不是配置错误。长按出变音符号（这一点与 Gboard 一致）；
#            底行 ?123 1.3（圆）· ，1.0 · 地球 1.0 · 空格 3.7 · 。1.0 · 换行 2.0（圆）
#            合计 10 列。Gboard 原版是 ?123 1.0 / ，1.0 / 空格 5.9 / 。1.0 / 换行 1.2
#            （键盘上没有中英键）。这里多一个地球键，空格必然比 Gboard 短；
#            标点保持 1.0（和 Gboard 的标点键同宽），腾出来的份量从空格里扣，
#            换行给到 2.0 —— Gboard 那种「宽主色回车主色键」的份量
#            逗号上滑 = 表情面板（Gboard 逗号键上的表情入口）
#   · 九键：左栏候选 + 符号，1=分词，2-9 字母，底行 123 空格 中英，
#            右栏 退格 / 重输 / 换行（Gboard 右栏只有退格与换行，见说明 8）
#   · ？123 面板：1-0 / @ # $ _ & - + ( ) / ，* " ' : ; ! ? = % ~，
#            底行 ABC 1.3 · ，1.0 · 空格 4.7 · 。1.0 · 换行 2.0，与 26 键同一套权重，
#            所以两个面板的标点、空格、回车实际宽度完全一致；顺序也照 Gboard 的
#            「ABC ， 空格 。 换行」（原来写的是 ABC ， 。 空格 回车，与主键盘错位）
#   · 数字面板：三列布局取自基座，右列四键（退格 / 空格 / 表情 / 回车）；
#            这里只补回车外观（圆角 40 + accent），与上面两个面板统一
#
# 说明（Gboard 特性与 Xime 渲染层限制，不是配置漏写）：
#   1. Gboard 顶部有一整条工具栏（G 标、翻译、麦克风、表情、设置齿轮），
#      Xime 的候选栏由引擎绘制，YAML 只能改配色，做不出那条工具栏。
#   2. 空格键文字由 Xime 固定（26 键/九键 = 方案名），Gboard 空格上并没有文字，
#      只在输入态显示“空格”一类的提示，无法复刻；长按空格 = 语音，行为保留。
#   3. Gboard 中文把「中/英」放在工具栏左上角的「中」图标里，键盘上不占键位。
#      Xime 没有那个图标位，所以本布局把地球键放在空格左边（Gboard 多语言时
#      地球键也正好在这个位置），单击切中英、长按选择输入法。
#   4. Gboard 的键分三档色：字母键、功能键（Shift/退格）、强调键（?123 淡强调、换行亮强调）。
#      换行键已经按这个做了：「主色 + 圆形」，写的是主题色记号
#        `background: accent`（= 主题强调色 primary_color），切主题自动跟着变：
#        gboard 薄荷 #4DB6AC · gboard_google 蓝 #1A73E8 · blue #2196F3 · red #F44336
#        green #2D7D32 · teal #4DB6AC · cyan #00ACC1。
#      不用写 background_dark —— `accent` 在暗色下自动取 accentDark（KeyboardTheme
#      由 primary_color 提亮得到），正好就是截图里那颗亮薄荷。
#      字色也不用配：渲染层按背景亮度自动取（深底浅字 / 浅底深字），
#      KeyStyle.kt 的 contrastTextColor 负责这一步。
#      ?123 那档「淡强调」（截图 #B5CCBC）没做：它比换行淡得多，而且它本来就是
#      功能键，跟随主题的 specialKeyBgColor 已经合适。
#      可选记号（写在任意按键的 background 上）：accent / primary（强调色）、
#      special（功能键色）、key（字母键色）、keyboard（键盘底色）。
#      三处回车写法完全一致（26 键 / ？123 面板 / 数字面板），都是
#      `corner_radius: 40` + `background: accent`；面板里的回车同样是功能键，
#      走 FunctionKeyCell → keyStyleOverride，所以按键级外观在面板上一样生效。
#   5. Gboard 的「按键边框（Key borders）」Xime 没有对应开关；Gboard 默认关边框，
#      所以这里也关掉阴影，靠键色与底色的亮度差、以及大缝来分区。
#   6. Gboard 有两页符号面板（?123 与 =\<），Xime 只有一个 common_symbols，
#      这里把两页常用的并成一页，底行左键为 ABC（返回字母键盘）。Gboard 没有
#      open_symbols 这个入口，所以面板里也不放它（全量符号面板仍可从数字面板进入）。
#   7. Gboard 没有独立数字键盘，本文不覆盖 keyboard.number（数字面板不是 Gboard 的
#      界面，覆盖反而会画出不存在的样式）；需要时从 ?123 长按「数字」或九键的 123 进入，
#      配色会自动跟随本主题。
#   8. Gboard 九键右栏只有「退格（上）」和「换行（下）」，Xime 的右栏按键会等高铺满，
#      两键会各占一半显得过高，所以保留 Xime 的「重输」做三键。不想要删掉 clear 即可。
#   9. 平板（smallestWidth ≥ 600dp）会自动套用 Xime 内置的 qwerty_tablet 等分段，
#      那套排布本身就是照 Gboard 平板做的（Tab / caps / 左右光标），本文件只覆盖手机布局。
#  10. 深色主题是截图逐点取色（底/键/功能键/字）；浅色与 Google 深色按 Gboard 亮色的
#      同结构换算，再用配色表里的原值核对。
#  11. Gboard 在 Android 12+ 会跟随壁纸取色（Material You），截图里的薄荷就是壁纸来的。
#      想完全跟随壁纸，把 style.color_scheme.light/dark 改成内置的 dynamic 即可。
#  12. Gboard 的滑行输入、单手模式、浮动键盘都是输入法内部行为，配置层管不到。
#  13. Gboard 的逗号键上滑是表情入口（笑脸图标画在逗号上方）。这里用
#      `switch_route: emoji` 复刻，键面提示直接写 emoji 字符 😊（Xime 的手势提示
#      只能是字符，接不了矢量图标）。英文键盘那边 CommaCell 的提示取的是 value
#      （"emoji"），会把路由名印在键面上，所以英文态只绑动作、不画提示
#      （display: bubble + bubble: false）。想让英文态也显示 😊，把
#      KeyboardLayout.CommaCell 里 k2SwipeUpLabel 的 isAsciiMode 分支改成
#      「label 优先、value 兜底」即可（EarthCell 同理）。
#  14. ?123 单击固定走 mode_change_common_symbol，不用内置的 mode_change：后者的目标是
#      「上次选过的面板」并被持久化（SettingsPreferences.modeChangeTargetIsNumber），
#      长按选过一次「数字」后，之后每次点 ?123 都会进数字面板 —— 这就是「功能反了」。
#      长按气泡的两项顺序也照 Xime 固定的图标来排：第一项恒为 t9 九宫格图标、第二项恒为
#      t26 全键盘图标，所以数字面板放第一位、常用符号放第二位。
#  15. 符号面板与数字面板都是 10 列、键面尺寸和字母键相同，圆角/缝要与字母键一致 ——
#      但「数值相同」不等于「继承」，所以 key 段里 number / symbol 两行是**必须写**的：
#      基座 xime.yaml 给这两个键盘单独调过缝（number 2/2、symbol 2/4），
#      KeysConfigHelper.spacingFor(keyboard) 的取值是
#        spacingOverrides[键盘].spacingX ?: 全局 spacingX
#      键盘名一旦命中覆盖，全局值就被彻底忽略。只写全局 3/5.75 时：
#        26 键  → qwerty 无覆盖 → 3 / 5.75
#        ?123   → symbol 命中基座 → 2 / 4     ← 面板看起来「挤」
#        数字面板 → number 命中基座 → 2 / 2   ← 更挤
#      圆角没这个问题，是因为基座那两条覆盖里只有 spacing，没有 corner_radius，
#      所以圆角一路回落到全局 6，只有缝对不上 —— 这就是「圆角对、缝不对」的成因。
#      坑：Key 段的键名不等于面板段名 —— 通用符号面板的段名是 common_symbols，
#      但渲染层取圆角和缝时传的是 "symbol"（KV.kt:1206 / KeyboardLayoutScreen.kt:234-236），
#      所以以前写的 `symbol: { corner_radius: 8 }` 正好把 ？123 面板撑成 8dp。
#      结论：这一页要调就调 `key.symbol`；`key.common_symbols` 不会生效。
#      平板不受影响：*_tablet 那几条覆盖仍是基座的 4/6。
#  16. 按键级外观（`keys.<id>.corner_radius / background / background_dark`）需要
#      Xime ≥ abda05a（支持按键级外观那次提交）。只写外观字段时会保留该键原有的
#      点按/长按/滑动配置（mergeKeyBinding 的 style-only 分支），所以本文件里这两个
#      圆键是把 corner_radius 和 tap 写在一起的，旧版本 Xime 会忽略未知字段、
#      退化成普通方键，不会报错。
#      九键（T9）、笔画、手写键盘目前不吃按键级外观，所以那里只改宽度。
#  17. 回车「换行↵」为什么带个箭头 / 为什么是 3 个字符：Xime 没有按键级字号配置，
#      字号由「文案长度」间接决定 —— KeyButton.kt:950 的兜底是
#        text.length > 2 ? 14f : 18f   （再乘 adaptiveKeyContentScale）
#      而 ?123 面板的功能键走 PanelKeyboardLayout.kt:157 写死的 ctrlFontSize = 14.sp。
#      于是 2 字符的「换行」在主键盘 18sp、切到面板变 14sp，肉眼就是「缩了」。
#      写成 3 字符后两边都落 14sp：26 键回车 / ?123 回车 / ?123 键（4 字符）/ 空格
#      全部同一档，面板来回切不见跳变。
#      代价要清楚：显式 label 会盖掉 Xime 随场景自动给的文案（发送 / 搜索 / 完成）。
#      想恢复自动文案，就把 label 删掉，同时接受主键盘回车回到 18sp
#      （面板仍是 14sp —— 那是代码写死的，配置层无解；`style.font_size` 是死字段，
#       app/src/main 里没有任何代码读它）。
# ═══════════════════════════════════════════════════════════════════════════

metadata:
  app_name: Xime
  app_version: ">=3.5.0"
  platform: android
  config_version: 1
  generator: "Xime Config Generator" # 暂时无用
  modified_time: "2026-11-06"

style:
  # 亮色用「浅色」、暗色用「深色」，与 Gboard 跟随系统的行为一致
  color_scheme:
    light: gboard
    dark: gboard
  dark_mode: 2 # 0=浅色 1=深色 2=跟随系统

color_schemes:
  # ─────────────────────────────────────────────────────────────────────────
  # 全部取自 Gboard 18.5.9 自带配色表，不是目测：
  #   APK 内 assets/theme/style_sheet_color_*.binarypb（protobuf）逐字段解析：
  #     default_keyboard_background_primary_color   → keyboard_bg_color
  #     default_bordered_key_color                  → key_bg_color
  #     default_bordered_key_dark_color             → special_key_bg_color
  #     default_generic_accent_color                → primary_color
  #     default_label_color                         → key_text_color
  #   并用 adb 截图（Note 搜索框里的真实键盘）逐点校验过，两处结果一致。
  #
  # 只做 Gboard「主题 → 颜色」这一组。Gboard 把「浅色 / 深色」摆成两个格子，
  # 是因为它的主题是固定色、要由用户手动选；Xime 的同一套 scheme 本身带 _dark
  # 字段、会跟随系统切换，所以这两对本就该合成一个主题（也是这里唯一的差异）。
  # ─────────────────────────────────────────────────────────────────────────

  # 浅色 / 深色：中性键面 + 薄荷绿强调，跟随系统
  #   浅 #F0F4F9 底 / #FFFFFF 键 / #E4E7E9 功能键 / #1F1F1F 字
  #   深 #263238 底 / #3B464C 键 / #2E3A40 功能键 / #FFFFFF 字
  gboard:
    name: "Gboard 浅色 / 深色"
    primary_color: 0x4DB6AC
    keyboard_background:
      type: solid
      color: 0xF0F4F9
      color_dark: 0x263238
    keyboard_bg_color: 0xF0F4F9
    key_bg_color: 0xFFFFFF
    key_bg_color_dark: 0x3B464C
    special_key_bg_color: 0xE4E7E9
    special_key_bg_color_dark: 0x2E3A40
    candidate_bar_bg_color: 0xF0F4F9
    key_text_color: 0x1F1F1F
    key_text_color_dark: 0xFFFFFF
    candidate_text_color: 0x1F1F1F
    candidate_text_color_dark: 0xFFFFFF
    # 选中候选：亮用浅色主题的薄荷绿 #4DB6AC，暗用深色主题的 #84CBC5
    candidate_selected_bg_color: 0x334DB6AC
    candidate_selected_bg_color_dark: 0x3384CBC5
    candidate_selected_text_color: 0x2A7C74
    candidate_selected_text_color_dark: 0x84CBC5

  # Google 浅色 / 深色：同一套键面，强调色换成 Google 蓝，跟随系统
  #   浅 = 浅色键面 + #1A73E8；深 = #363B40 底 / #565A5E 键 + #5E97F6
  gboard_google:
    name: "Gboard Google 浅色 / 深色"
    primary_color: 0x1A73E8
    keyboard_background:
      type: solid
      color: 0xF0F4F9
      color_dark: 0x363B40
    keyboard_bg_color: 0xF0F4F9
    key_bg_color: 0xFFFFFF
    key_bg_color_dark: 0x565A5E
    special_key_bg_color: 0xE4E7E9
    special_key_bg_color_dark: 0x454B50
    candidate_bar_bg_color: 0xF0F4F9
    key_text_color: 0x1F1F1F
    key_text_color_dark: 0xFFFFFF
    candidate_text_color: 0x1F1F1F
    candidate_text_color_dark: 0xFFFFFF
    candidate_selected_bg_color: 0x331A73E8
    candidate_selected_bg_color_dark: 0x335E97F6
    candidate_selected_text_color: 0x1255B0
    candidate_selected_text_color_dark: 0x5E97F6

  # 蓝色：style_sheet_color_blue.binarypb
  #   底 #1565C0（Blue 800）· 字母键 #3F80CB · 功能键 #2771C4 · 强调 #2196F3 · 白字
  gboard_blue:
    name: "Gboard 蓝"
    primary_color: 0x2196F3
    keyboard_background:
      type: solid
      color: 0x1565C0
      color_dark: 0x1565C0
    keyboard_bg_color: 0x1565C0
    key_bg_color: 0x3F80CB
    key_bg_color_dark: 0x3F80CB
    special_key_bg_color: 0x2771C4
    special_key_bg_color_dark: 0x2771C4
    candidate_bar_bg_color: 0x1565C0
    key_text_color: 0xFFFFFF
    key_text_color_dark: 0xFFFFFF
    candidate_text_color: 0xFFFFFF
    candidate_text_color_dark: 0xFFFFFF
    candidate_selected_bg_color: 0x33FFFFFF
    candidate_selected_bg_color_dark: 0x33FFFFFF
    candidate_selected_text_color: 0xFFFFFF
    candidate_selected_text_color_dark: 0xFFFFFF

  # 红色：style_sheet_color_red.binarypb
  gboard_red:
    name: "Gboard 红"
    primary_color: 0xF44336
    keyboard_background:
      type: solid
      color: 0xC62828
      color_dark: 0xC62828
    keyboard_bg_color: 0xC62828
    key_bg_color: 0xD04E4E
    key_bg_color_dark: 0xD04E4E
    special_key_bg_color: 0xCA3838
    special_key_bg_color_dark: 0xCA3838
    candidate_bar_bg_color: 0xC62828
    key_text_color: 0xFFFFFF
    key_text_color_dark: 0xFFFFFF
    candidate_text_color: 0xFFFFFF
    candidate_text_color_dark: 0xFFFFFF
    candidate_selected_bg_color: 0x33FFFFFF
    candidate_selected_bg_color_dark: 0x33FFFFFF
    candidate_selected_text_color: 0xFFFFFF
    candidate_selected_text_color_dark: 0xFFFFFF

  # 绿色：style_sheet_color_green.binarypb
  gboard_green:
    name: "Gboard 绿"
    primary_color: 0x2D7D32
    keyboard_background:
      type: solid
      color: 0x43A047
      color_dark: 0x43A047
    keyboard_bg_color: 0x43A047
    key_bg_color: 0x64B168
    key_bg_color_dark: 0x64B168
    special_key_bg_color: 0x51A755
    special_key_bg_color_dark: 0x51A755
    candidate_bar_bg_color: 0x43A047

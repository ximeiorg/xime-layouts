# ═══════════════════════════════════════════════════════════════════════════
# 搜狗输入法风格布局（Xime / 安卓）
#
# 参考：搜狗输入法手机端截图（26 键全键盘、九宫格拼音、九宫格数字），配色按截图实测取色
# 基座：Xime/app/src/main/assets/xime.yaml（未写的键自动回退基座值）
#
# 安装：把本文件放到 Xime 用户目录 rime/xime.custom.yaml
#       （Android/data/<包名>/files/rime/），然后在键盘设置里重新部署/重启输入法。
#
# 覆盖范围：
#   · 主题色：两套（与搜狗「默认布局 / 默认布局（蓝）」一一对应）
#             默认布局 = 浅灰底 #F2F3F7 + 纯白键 + #CACBD6 功能键 + 搜狗橙 #FB6D12
#             默认布局（蓝）= 同一套中性色，强调色换成 #007AFD
#             暗色 = #1C1C1E 底 + #363638 键 + #262628 功能键（暂按搜狗深色估的）
#   · 26 键：Q 行嵌 1-0 提示、A 行 ~ ! @ # % “ ” * ?、
#            Z 行 ( ) - ~ : ; /，底行 符 123 ， 空格 。 中英 发送（发送=强调色）
#   · 九键：左栏候选 + ，。？！，主区 分词/ABC… + 123 空格 中英，
#            右栏 退格 / 重输 / 0 / 换行
#   · 数字面板：左键柱 % / - +，1-9、返回 0 空格，右栏 退格 . @ 换行
#   · 通用符号：1-0 / - / : ~ ( ) … @ “ ” / 符 。 ， 、 ? ! . 退格 /
#               返回 表情 123 空格 换行
#
# 说明（Xime 渲染层的固有限制，非配置遗漏）：
#   1. 空格键文字由 Xime 固定（26 键/九键 = 方案名，符号面板 = “空格”），
#      搜狗空格上的麦克风图标无法复刻；长按空格 = 语音，行为保留。
#   2. 键色只有“普通键 / 功能键”两组：数字面板右栏的 . @、九键的 0 在搜狗里是
#      灰键，Xime 只能按普通键画成白键。
#   3. 数字面板左键柱（% / - +）由 Xime 用普通键底色绘制，无法像搜狗那样整柱灰底。
#   3b. 26 键底行的「符 / 123」不能用内置 open_symbols / number 键位：
#       · open_symbols 在主键盘发 "symbol" → 只会打开 Xime 自带的符号覆盖页（SymbolKeyboardLayout），
#         不是本文件的 keyboard.common_symbols 布局；
#       · number 发的 "number" 在 KeyboardView.fullScreenOnKeyPress 里没有分支，会落到 else，
#         点击等于没反应。
#       所以这两个键改成本文件的 fu（自定义键 + background: special）与 mode_change，
#       用 command: mode_change_common_symbol / mode_change_number 分发。
#   4. 九键没有内置的 “0” 键：这里用自定义键 zero 直接上屏 “0”。搜狗里 0 是九键
#      分隔语义，行为略有差异；不想要删掉 right 里的 zero 即可。
#   5. 九键“中英”在 Xime 里固定是地球图标，无法显示搜狗的两行“中/英”；
#      26 键“中英”同样按你之前的偏好用地球图标，想要文字键面可改成
#      earth: { tap: { label: "中英", action: toggle_ascii, bubble: false }, ... }
#   6. 平板会自动套用 Xime 内置的 qwerty_tablet 等分段，本文件只覆盖手机布局。
#   7. 两套主题的强调色取自「默认布局 / 默认布局（蓝）」截图：橙 0xFB6D12、蓝 0x007AFD。
#      发送键用 background: accent 跟随主题；暗色配色仍是估的，拿到深色截图后再校准。
#      选中候选底用 candidate_selected_bg_color / _dark（0xAARRGGBB，自带透明度）。
# ═══════════════════════════════════════════════════════════════════════════

metadata:
  app_name: Xime
  app_version: ">=3.5.0"
  platform: android
  config_version: 1
  generator: "Xime Config Generator" # 暂时无用
  modified_time: "2026-11-03"

style:
  color_scheme:
    light: sogou
    dark: sogou
  dark_mode: 2 # 0=浅色 1=深色 2=跟随系统

color_schemes:
  # ── 默认布局（搜狗橙）：发送键 / 候选强调色都是 #FB6D12 ──
  sogou:
    name: "搜狗主题"
    primary_color: 0xFB6D12

    # 搜狗键盘底是纯色浅灰蓝，没有渐变
    keyboard_background:
      type: solid
      color: 0xF2F3F7
      color_dark: 0x1C1C1E
    keyboard_bg_color: 0xF2F3F7

    key_bg_color: 0xFFFFFF
    key_bg_color_dark: 0x363638

    # 搜狗功能键比普通键暗一档（截图实测 #CACBD6）
    special_key_bg_color: 0xCACBD6
    special_key_bg_color_dark: 0x262628

    candidate_bar_bg_color: 0xF2F3F7
    candidate_bar_background:
      type: solid
      color: 0xF2F3F7
      color_dark: 0x1C1C1E

    key_text_color: 0x000000
    key_text_color_dark: 0xF2F2F2
    candidate_text_color: 0x1A1A1A
    candidate_text_color_dark: 0xE8E8E8
    # 选中候选：橙 10% 透明底 + 橙字
    candidate_selected_bg_color: 0x1AFB6D12
    candidate_selected_bg_color_dark: 0x1AFB6D12
    candidate_selected_text_color: 0xE85D06
    candidate_selected_text_color_dark: 0xFF9550

  # ── 默认布局（蓝）：中性色完全同上，只换强调色 #007AFD ──
  sogou_blue:
    name: "搜狗主题（蓝）"
    primary_color: 0x007AFD

    keyboard_background:
      type: solid
      color: 0xF2F3F7
      color_dark: 0x1C1C1E
    keyboard_bg_color: 0xF2F3F7

    key_bg_color: 0xFFFFFF
    key_bg_color_dark: 0x363638

    special_key_bg_color: 0xCACBD6
    special_key_bg_color_dark: 0x262628

    candidate_bar_bg_color: 0xF2F3F7
    candidate_bar_background:
      type: solid
      color: 0xF2F3F7
      color_dark: 0x1C1C1E

    key_text_color: 0x000000
    key_text_color_dark: 0xF2F2F2
    candidate_text_color: 0x1A1A1A
    candidate_text_color_dark: 0xE8E8E8
    candidate_selected_bg_color: 0x1A007AFD
    candidate_selected_bg_color_dark: 0x1A007AFD
    candidate_selected_text_color: 0x0069DB
    candidate_selected_text_color_dark: 0x6FB6FF

keyboard:
  # ── 键面圆角 / 间距 ──
  key:
    corner_radius: 4
    # 键间距按「左右各留 spacing_x」计算，实际缝宽 = 2 * spacing
    spacing_x: 3.5        # 横向缝 ≈10px（截图实测）
    spacing_y: 5.5        # 纵向缝 ≈17px
    # 九键 / 数字 / 符号面板的键更高，行间缝要比 26 键小
    t9: { spacing_x: 3.5, spacing_y: 4 }
    number: { spacing_x: 3.5, spacing_y: 4 }
    symbol: { spacing_x: 3.5, spacing_y: 4 }

  # shape_radius 要和 key.corner_radius 一致（渲染时取两者较大值，否则阴影会从键角露出来）
  shadow:
    enabled: true
    elevation: 0.5
    shape_radius: 4

  # ═════════════════════════════════════════════════════════════════════════
  # 26 键全键盘（中文）
  # ═════════════════════════════════════════════════════════════════════════
  qwerty:
    button_layout: standard
    layout:
      columns: 10
      rows:
        - [q, w, e, r, t, y, u, i, o, p]
        - [a, s, d, f, g, h, j, k, l]
        - [shift, z, x, c, v, b, n, m, delete]
        - [fu, mode_change, comma, space, period, earth, enter]
    keys:
      # ── 第一行：上滑 1-0（键面右上角提示）──
      q: { tap: "q", swipe_up: "1", long_press: { display: "bubble", values: ["q", "Q"] } }
      w: { tap: "w", swipe_up: "2", long_press: { display: "bubble", values: ["w", "W"] } }
      e: { tap: "e", swipe_up: "3", long_press: { display: "bubble", values: ["e", "E"] } }
      r: { tap: "r", swipe_up: "4", long_press: { display: "bubble", values: ["r", "R"] } }
      t: { tap: "t", swipe_up: "5", long_press: { display: "bubble", values: ["t", "T"] } }
      y: { tap: "y", swipe_up: "6", long_press: { display: "bubble", values: ["y", "Y"] } }
      u: { tap: "u", swipe_up: "7", long_press: { display: "bubble", values: ["u", "U"] } }
      i: { tap: "i", swipe_up: "8", long_press: { display: "bubble", values: ["i", "I"] } }
      o: { tap: "o", swipe_up: "9", long_press: { display: "bubble", values: ["o", "O"] } }
      p: { tap: "p", swipe_up: "0", long_press: { display: "bubble", values: ["p", "P"] } }

      # ── 第二行：上滑 ~ ! @ # % “ ” * ? ──
      a: { tap: "a", swipe_up: "~", long_press: { display: "bubble", values: ["a", "A"] } }
      s: { tap: "s", swipe_up: "!", long_press: { display: "bubble", values: ["s", "S"] } }
      d: { tap: "d", swipe_up: "@", long_press: { display: "bubble", values: ["d", "D"] } }
      f: { tap: "f", swipe_up: "#", long_press: { display: "bubble", values: ["f", "F"] } }
      g: { tap: "g", swipe_up: "%", long_press: { display: "bubble", values: ["g", "G"] } }
      h: { tap: "h", swipe_up: "“", long_press: { display: "bubble", values: ["h", "H"] } }
      j: { tap: "j", swipe_up: "”", long_press: { display: "bubble", values: ["j", "J"] } }
      k: { tap: "k", swipe_up: "*", long_press: { display: "bubble", values: ["k", "K"] } }
      l: { tap: "l", swipe_up: "?", long_press: { display: "bubble", values: ["l", "L"] } }

      # ── 第三行：上滑 ( ) - ~ : ; / ──
      z: { tap: "z", swipe_up: "(", long_press: { display: "bubble", values: ["z", "Z"] } }
      x: { tap: "x", swipe_up: ")", long_press: { display: "bubble", values: ["x", "X"] } }
      c: { tap: "c", swipe_up: "-", long_press: { display: "bubble", values: ["c", "C"] } }
      v: { tap: "v", swipe_up: "~", long_press: { display: "bubble", values: ["v", "V"] } }
      b: { tap: "b", swipe_up: ":", long_press: { display: "bubble", values: ["b", "B"] } }
      n: { tap: "n", swipe_up: ";", long_press: { display: "bubble", values: ["n", "N"] } }
      m: { tap: "m", swipe_up: "/", long_press: { display: "bubble", values: ["m", "M"] } }

      # ── 功能键 ──
      # 底行按截图实测（以字母键为 1，合计正好 10 列，与 Q 行格子对齐）：
      #   符 1.52 ：123 1.24 ：，0.94 ：空格 2.62 ：。0.94 ：中英 1.24 ：换行 1.50
      shift: { width: 1.5 }   # 单击/双击大写；行为沿用内置
      delete: { width: 1.5 }  # 退格；长按连删、上滑清空等沿用内置

      # 符：自定义键 + 功能键底色（background: special），点按进本文件的常用符号面板。
      # 不能用内置 open_symbols：它在主键盘上发的是 "symbol"，只会打开 Xime 自带的符号覆盖页，
      # 不是 keyboard.common_symbols 这套布局。
      fu:
        width: 1.52
        background: special
        tap: { label: "符", action: command, value: mode_change_common_symbol, bubble: false }

      # 123：必须挂在 mode_change 键位上。内置 number 键在主键盘发的是 "number"，
      # 而 KeyboardView.fullScreenOnKeyPress 里没有 "number" 分支（只有 mode_change_number），
      # 会落到 else 当成普通字符，点了没反应——这就是之前「进不去数字键盘」的原因。
      mode_change:
        width: 1.24
        tap: { label: "123", action: command, value: mode_change_number, bubble: false }
        long_press:
          display: bubble
          values:
            - { label: "数字", action: command, value: mode_change_number }
            - { label: "常用符号", action: command, value: mode_change_common_symbol }

      # 逗号：键面“，”，上滑“。”
      comma:
        width: 0.94
        tap: { label: "，", value: "," }
        swipe_up: { label: "。", value: "." }
        long_press: { display: "bubble", values: [{ action: commit, value: "," }, { action: commit, value: "." }] }

      space: { width: 2.62 }  # 空格：点按空格、长按语音等行为沿用内置

      # 句号：键面“。”，长按可选 。 ， ？ ！
      period:
        width: 0.94
        tap: { label: "。", value: "." }
        long_press:
          display: bubble
          values:
            - { action: commit, value: "。" }
            - { action: commit, value: "，" }
            - { action: commit, value: "？" }
            - { action: commit, value: "！" }

      # 中/英：用 Xime 默认地球图标（长按仍弹出“选择输入法”）
      earth:
        width: 1.24
        tap: { icon: "language", action: toggle_ascii, bubble: false }
        long_press:
          display: bubble
          values:
            - { label: "选择输入法", action: command, value: show_ime_picker }

      # 发送：搜狗这里是整颗强调色实心键（默认布局=橙 #FB6D12，蓝色布局=#007AFD）。
      # background: accent 跟主题强调色走，文案仍由 Xime 按场景自动给（发送/换行/搜索）。
      enter: { width: 1.5, background: accent }

  # ═════════════════════════════════════════════════════════════════════════
  # 26 键全键盘（英文）——排布与中文一致，标点用半角，沿用英文输入语义
  # ═════════════════════════════════════════════════════════════════════════
  qwerty_en:
    button_layout: standard
    layout:
      columns: 10
      rows:
        - [q, w, e, r, t, y, u, i, o, p]
        - [a, s, d, f, g, h, j, k, l]
        - [shift, z, x, c, v, b, n, m, delete]
        - [fu, mode_change, comma, space, period, earth, enter]
    keys:
      q: { tap: "q", swipe_up: "1", long_press: { display: "bubble", values: ["q", "Q"] } }
      w: { tap: "w", swipe_up: "2", long_press: { display: "bubble", values: ["w", "W"] } }
      e: { tap: "e", swipe_up: "3", long_press: { display: "bubble", values: ["e", "E"] } }
      r: { tap: "r", swipe_up: "4", long_press: { display: "bubble", values: ["r", "R"] } }
      t: { tap: "t", swipe_up: "5", long_press: { display: "bubble", values: ["t", "T"] } }
      y: { tap: "y", swipe_up: "6", long_press: { display: "bubble", values: ["y", "Y"] } }
      u: { tap: "u", swipe_up: "7", long_press: { display: "bubble", values: ["u", "U"] } }
      i: { tap: "i", swipe_up: "8", long_press: { display: "bubble", values: ["i", "I"] } }
      o: { tap: "o", swipe_up: "9", long_press: { display: "bubble", values: ["o", "O"] } }
      p: { tap: "p", swipe_up: "0", long_press: { display: "bubble", values: ["p", "P"] } }
      a: { tap: "a", swipe_up: "~", long_press: { display: "bubble", values: ["a", "A"] } }
      s: { tap: "s", swipe_up: "!", long_press: { display: "bubble", values: ["s", "S"] } }
      d: { tap: "d", swipe_up: "@", long_press: { display: "bubble", values: ["d", "D"] } }
      f: { tap: "f", swipe_up: "#", long_press: { display: "bubble", values: ["f", "F"] } }
      g: { tap: "g", swipe_up: "%", long_press: { display: "bubble", values: ["g", "G"] } }
      h: { tap: "h", swipe_up: "\"", long_press: { display: "bubble", values: ["h", "H"] } }
      j: { tap: "j", swipe_up: "'", long_press: { display: "bubble", values: ["j", "J"] } }
      k: { tap: "k", swipe_up: "*", long_press: { display: "bubble", values: ["k", "K"] } }
      l: { tap: "l", swipe_up: "?", long_press: { display: "bubble", values: ["l", "L"] } }
      z: { tap: "z", swipe_up: "(", long_press: { display: "bubble", values: ["z", "Z"] } }
      x: { tap: "x", swipe_up: ")", long_press: { display: "bubble", values: ["x", "X"] } }
      c: { tap: "c", swipe_up: "-", long_press: { display: "bubble", values: ["c", "C"] } }
      v: { tap: "v", swipe_up: "~", long_press: { display: "bubble", values: ["v", "V"] } }
      b: { tap: "b", swipe_up: ":", long_press: { display: "bubble", values: ["b", "B"] } }
      n: { tap: "n", swipe_up: ";", long_press: { display: "bubble", values: ["n", "N"] } }
      m: { tap: "m", swipe_up: "/", long_press: { display: "bubble", values: ["m", "M"] } }

      shift: { width: 1.5 }
      delete: { width: 1.5 }
      fu:
        width: 1.52
        background: special
        tap: { label: "符", action: command, value: mode_change_common_symbol, bubble: false }
      mode_change:
        width: 1.24
        tap: { label: "123", action: command, value: mode_change_number, bubble: false }
        long_press:
          display: bubble
          values:
            - { label: "数字", action: command, value: mode_change_number }
            - { label: "常用符号", action: command, value: mode_change_common_symbol }
      comma:
        width: 0.94
        tap: { label: ",", value: "," }
        swipe_up: { label: ".", value: "." }
        long_press: { display: "bubble", values: [{ action: commit, value: "," }, { action: commit, value: "." }] }
      space: { width: 2.62 }
      period:
        width: 0.94
        tap: { label: ".", value: "." }
        long_press:
          display: bubble
          values:
            - { action: commit, value: "." }
            - { action: commit, value: "," }
            - { action: commit, value: "?" }
            - { action: commit, value: "!" }
      earth:
        width: 1.24
        tap: { icon: "language", action: toggle_ascii, bubble: false }
        long_press:
          display: bubble
          values:
            - { label: "选择输入法", action: command, value: show_ime_picker }
      enter: { width: 1.5, background: accent }

  # ═════════════════════════════════════════════════════════════════════════
  # 九宫格拼音（T9）——搜狗排布
  #   左栏：候选面板（空闲时显示 ，。？！）+ 符
  #   主区：分词 / ABC / DEF，GHI / JKL / MNO，PQRS / TUV / WXYZ，123 空格 中英
  #   右栏：退格 / 重输 / 0 / 换行
  #
  # 何时显示九键：由基座的 keyboard.t9.schemas 决定（默认 t9_pinyin / t9 /
  # wanxiang_t9 / rime_frost_t9）。想让自己的方案也用九键，在本段追加
  # （列表要整段写出，不能只写新增项）：
  #   schemas: [t9_pinyin, t9, wanxiang_t9, rime_frost_t9, 你的方案id]
  # ═════════════════════════════════════════════════════════════════════════
  t9:
    type: t9
    layout:
      left: [candidates, symbol]
      rows:
        - ["1", "2", "3"]
        - ["4", "5", "6"]
        - ["7", "8", "9"]
        - [number, space, earth]
      right: [delete, clear, zero, enter]

    # 左栏空闲时显示的快捷符号（搜狗为 ，。？！）
    side_symbols: ["，", "。", "？", "！"]

    keys:
      # 底行比例：123 / 中英 比字母键窄一点，空格更宽（搜狗观感）
      number: { width: 0.88 }
      space: { width: 1.72 }
      # 中英切换用内置地球图标（与 26 键一致）
      earth: { width: 0.88 }
      # 右栏四键等高（内置 enter 权重是 2）
      enter: { width: 1.0 }
      # 搜狗的 0：Xime 没有九键 0 键，这里用自定义键直接上屏 “0”
      zero: { tap: { label: "0", action: commit, value: "0" } }

  # ═════════════════════════════════════════════════════════════════════════
  # 数字面板（九宫格数字）——搜狗排布
  # 左键柱 % / - +，下面“符”；1-9 + 返回 0 空格；右栏 退格 . @ 换行
  # ═════════════════════════════════════════════════════════════════════════
  number:
    type: columns
    layout:
      left:
        - ["%", "/", "-", "+"]
        - open_symbols
      rows:
        - ["1", "2", "3"]
        - ["4", "5", "6"]
        - ["7", "8", "9"]
        - [back, "0", space_key]
      right: [delete, ".", "@", enter]
    keys:
      # 数字面板的返回键：配置 label 后显示文字（不配是返回图标）
      back: { tap: { label: "返回" } }
      open_symbols: { tap: { label: "符" } }
      # 换行：跟随主题强调色（搜狗原版是灰键，这里按「发送键用强调色」的统一约定）
      enter: { tap: { action: send_rime, value: enter, label: "换行" }, background: accent }
      # 搜狗数字面板里，左键柱 % / - + 和最右列的 . @ 都是功能键灰底，不是白键；
      # background: special = special_key_bg_color（#CACBD6 / 暗色 #262628）
      "%": { background: special }
      "/": { background: special }
      "-": { background: special }
      "+": { background: special }
      ".": { background: special }
      "@": { background: special }

  # ═════════════════════════════════════════════════════════════════════════
  # 通用符号面板
  # 1-0 / - / : ~ ( ) … @ “ ” / 符 。 ， 、 ? ! . 退格 /
  # 返回 表情 123 空格 换行
  # ═════════════════════════════════════════════════════════════════════════
  common_symbols:
    type: full
    layout:
      rows:
        - ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"]
        - ["-", "/", ":", "~", "(", ")", "…", "@", "“", "”"]
        - [open_symbols, "。", "，", "、", "?", "!", ".", delete]
        - [back, emoji, number, space_key, enter]
    keys:
      open_symbols: { width: 1.2, tap: { label: "符" } }
      delete: { width: 1.2 }
      back: { width: 1.45, tap: { label: "返回" } }
      emoji: { width: 0.91 }
      number: { width: 0.91 }
      space_key: { width: 4.55 }
      enter: { width: 2.18, tap: { action: send_rime, value: enter, label: "换行" }, background: accent }
